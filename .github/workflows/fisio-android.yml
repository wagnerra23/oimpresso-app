# Build do app do PACIENTE do Fisio (com.oimpresso.fisio) — Trusted Web Activity da pasta fisio-twa/.
# Gera o AAB assinado com a MESMA upload key do app oimpresso (segredos ANDROID_KEYSTORE_*);
# a Play aceita a mesma upload key em mais de um app. A chave definitiva fica no Google.
# Roda no PR que mexe em fisio-twa/ (o AAB sai como artefato, sem precisar de merge) e por dispatch.
# Não mexe no app oimpresso (pasta android/).
name: fisio-android
on:
  pull_request:
    paths:
      - 'fisio-twa/**'
      - '.github/workflows/fisio-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fisio-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Keystore de upload
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 vazio"; exit 2; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: bundleRelease
        working-directory: fisio-twa
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Confere assinatura e imprime SHA-256 da upload key
        shell: bash
        run: |
          set -euo pipefail
          AAB=fisio-twa/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          {
            echo "### AAB do app do paciente (com.oimpresso.fisio)"
            echo "versionCode: ${{ github.run_number }}"
            keytool -printcert -jarfile "$AAB" | grep -E 'SHA256:'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fisio-release-aab-${{ github.run_number }}
          path: fisio-twa/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
